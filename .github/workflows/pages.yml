name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build localized pages from the current release
        run: python3 build_site.py
      - name: Validate static site
        run: |
          test -f index.html || { echo "index.html missing"; exit 1; }
          test -f app.js || { echo "app.js missing"; exit 1; }
          node --check app.js
          python3 - <<'PY'
          import json
          json.load(open("downloads.json"))
          json.load(open("manifest.webmanifest"))
          r = json.load(open("release.json"))
          assert r.get("tag", "").startswith("v"), "release.json needs a v* tag"
          assert isinstance(r.get("assets"), list) and len(r["assets"]) >= 10, "release.json assets incomplete"
          print("json ok:", r["tag"], len(r["assets"]), "assets")
          PY
          # no external render-blocking assets allowed (Lighthouse 100 gate)
          if grep -RoiE '<link[^>]+rel="stylesheet"' . --include='*.html'; then
            echo "external stylesheet found — keep CSS inline for 100 score"; exit 1;
          fi
          if grep -RoiE '<script[^>]+src="http' . --include='*.html'; then
            echo "external script found — keep JS local for 100 score"; exit 1;
          fi
          echo "size report:"; du -sh .; ls -la index.html ar/index.html app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify IndexNow about the English and Arabic pages
        run: |
          KEY="$(cat 7209de92f0507d41896aae3be1c8b4b6.txt)"
          CODE="$(curl -sS --max-time 20 -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "{\"host\":\"omdaral.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"https://omdaral.github.io/beam-website/7209de92f0507d41896aae3be1c8b4b6.txt\",\"urlList\":[\"https://omdaral.github.io/beam-website/\",\"https://omdaral.github.io/beam-website/ar/\",\"https://omdaral.github.io/beam-website/guides/share-files-over-wifi/\",\"https://omdaral.github.io/beam-website/ar/guides/share-files-over-wifi/\",\"https://omdaral.github.io/beam-website/guides/android-to-windows-file-sharing/\",\"https://omdaral.github.io/beam-website/ar/guides/android-to-windows-file-sharing/\"]}" \
            https://api.indexnow.org/indexnow)"
          echo "IndexNow response: $CODE"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            cat /tmp/indexnow-response.txt
            exit 1
          fi
